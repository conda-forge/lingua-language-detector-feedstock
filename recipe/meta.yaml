{% set name = "lingua-language-detector" %}
{% set version = "2.2.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/pemistahl/lingua-py/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 411b5622e2a6891159da8f6a595522c14cb5f5d80c6f463e90f7d84b013b6a5d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - gcld >=3.0.13,<4.0.0
    - langdetect >=1.0.9,<2.0.0
    - langid >=1.1.6,<2.0.0
    - matplotlib-base >=3.10.8,<4.0.0
    - numpy >=2.4.2,<3.0.0
    - pandas >=2.3.3,<3.0.0
    - psutil >=7.0.0,<8.0.0
    - pycld2 >=0.42,<1.0
    - seaborn >=0.13.2,<0.14.0
    - simplelemma ==0.9.1

test:
  imports:
    - lingua
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/pemistahl/lingua-py
  summary: An accurate natural language detection library, suitable for long and short text alike
  license: Apache-2.0
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - thewchan
